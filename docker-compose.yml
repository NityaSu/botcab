services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: botcab
      POSTGRES_USER: botcab
      POSTGRES_PASSWORD: botcab
    ports:
      - "5432:5432"
    volumes:
      - botcab_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  botcab_pg:
