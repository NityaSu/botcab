spring:
  application:
    name: botcab
  datasource:
    url: jdbc:postgresql://localhost:5432/botcab
    username: botcab
    password: botcab
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: botcab
    description: Ride-booking modular monolith
