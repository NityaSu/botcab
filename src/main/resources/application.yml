spring:
  application:
    name: botcab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/botcab}
    username: ${SPRING_DATASOURCE_USERNAME:botcab}
    password: ${SPRING_DATASOURCE_PASSWORD:botcab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      # Only set when Redis has a password (e.g. Railway). Blank "" makes Redisson AUTH fail locally.
      password: ${SPRING_DATA_REDIS_PASSWORD:}

# Railway/Render set PORT; local Compose uses SERVER_PORT or 8080.
server:
  port: ${PORT:${SERVER_PORT:8080}}

botcab:
  jwt:
    # Override in production (Railway): BOTCAB_JWT_SECRET — min 32 chars.
    secret: ${BOTCAB_JWT_SECRET:botcab-dev-jwt-secret-change-me-32b}
    ttl-days: ${BOTCAB_JWT_TTL_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # Liveness = process up (for platform healthchecks). Readiness still includes DB/Redis.
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: botcab
    description: Ride-booking modular monolith
